
<!-- ==========================================
     EXCEL YOU - FORGOT PASSWORD POPUP
========================================== -->

<div class="forgot-overlay"
     id="forgotPasswordOverlay"
     aria-hidden="true">

    <div class="forgot-popup" role="dialog"
         aria-modal="true"
         aria-labelledby="forgotPasswordTitle">

        <!-- CLOSE BUTTON -->
        <button type="button"
                class="forgot-close"
                id="closeForgotPassword"
                aria-label="Close">
            &times;
        </button>

        <!-- LOCK ICON -->
        <div class="forgot-icon">
            <i class="fas fa-lock"></i>
        </div>

        <!-- HEADING -->
        <h2 id="forgotPasswordTitle">Forgot Password?</h2>

        <p class="forgot-description">
            Don't worry! Enter your registered email address.
            We'll help you reset your password.
        </p>

        <!-- FORM -->
        <form id="forgotPasswordForm">

            <div class="forgot-input-group">
                <i class="fas fa-envelope"></i>

                <input
                    type="email"
                    id="forgotEmail"
                    name="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >
            </div>

            <button type="submit" class="forgot-submit">
                Send Reset Link
            </button>

        </form>

        <!-- MESSAGE -->
        <div id="forgotMessage"
             class="forgot-message"
             aria-live="polite">
        </div>

        <!-- BACK TO LOGIN -->
        <button type="button"
                class="forgot-back"
                id="backToLogin">
            <i class="fas fa-arrow-left"></i>
            Back to Login
        </button>

    </div>

</div>
