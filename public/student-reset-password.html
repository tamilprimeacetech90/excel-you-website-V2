
<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | EXCEL YOU</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ================================
           GLOBAL
        ================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;

            font-family: "Poppins", sans-serif;

            transition:
                background 0.35s ease,
                color 0.35s ease;
        }

        /* ================================
           DARK THEME
        ================================= */

        html[data-theme="dark"] body {
            background:
                radial-gradient(
                    circle at 20% 15%,
                    rgba(14, 116, 200, 0.20),
                    transparent 38%
                ),
                linear-gradient(
                    135deg,
                    #020817,
                    #071a35,
                    #020817
                );

            color: #eaf6ff;
        }

        html[data-theme="dark"] .reset-card {
            background: linear-gradient(
                145deg,
                rgba(8, 30, 62, 0.94),
                rgba(3, 16, 39, 0.94)
            );

            border: 2px solid rgba(56, 189, 248, 0.55);

            box-shadow:
                0 0 25px rgba(14, 165, 233, 0.16),
                0 0 55px rgba(37, 99, 235, 0.12),
                inset 0 0 25px rgba(56, 189, 248, 0.04);
        }

        html[data-theme="dark"] .reset-description {
            color: #a8c4df;
        }

        html[data-theme="dark"] .input-group input {
            background: rgba(2, 12, 30, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #ffffff;
        }

        html[data-theme="dark"] .input-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
        }

        html[data-theme="dark"] .input-group label {
            color: #c5def5;
        }

        html[data-theme="dark"] .theme-btn {
            color: #7dd3fc;
            border-color: rgba(56, 189, 248, 0.4);
            background: rgba(8, 47, 73, 0.5);
        }

        html[data-theme="dark"] .back-link {
            color: #7dd3fc;
        }

        /* ================================
           LIGHT THEME
        ================================= */

        html[data-theme="light"] body {
            background:
                radial-gradient(
                    circle at 20% 15%,
                    rgba(59, 130, 246, 0.12),
                    transparent 38%
                ),
                linear-gradient(
                    135deg,
                    #eaf3ff,
                    #f8fbff,
                    #e7f0ff
                );

            color: #102747;
        }

        html[data-theme="light"] .reset-card {
            background: linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.88),
                rgba(240, 248, 255, 0.78)
            );

            border: 2px solid rgba(37, 99, 235, 0.32);

            box-shadow:
                0 12px 45px rgba(30, 64, 175, 0.12),
                0 0 25px rgba(56, 189, 248, 0.10);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        html[data-theme="light"] .reset-description {
            color: #526783;
        }

        html[data-theme="light"] .input-group input {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(37, 99, 235, 0.25);
            color: #102747;
        }

        html[data-theme="light"] .input-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.12);
        }

        html[data-theme="light"] .input-group label {
            color: #334d70;
        }

        html[data-theme="light"] .theme-btn {
            color: #1d4ed8;
            border-color: rgba(37, 99, 235, 0.25);
            background: rgba(255, 255, 255, 0.8);
        }

        html[data-theme="light"] .back-link {
            color: #1d4ed8;
        }

        /* ================================
           MAIN CARD
        ================================= */

        .reset-card {
            width: 100%;
            max-width: 465px;

            padding: 42px 38px;

            border-radius: 24px;

            position: relative;

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            transition: 0.35s ease;
        }

        .top-controls {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 22px;
        }

        .theme-btn {
            padding: 9px 15px;

            border: 1px solid;
            border-radius: 30px;

            font-family: "Poppins", sans-serif;
            font-size: 12px;
            font-weight: 600;

            cursor: pointer;
            transition: 0.25s ease;
        }

        .theme-btn:hover {
            transform: translateY(-2px);
        }

        /* ================================
           BRAND
        ================================= */

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h1 {
            font-family: "Orbitron", sans-serif;
            font-size: 27px;
            font-weight: 800;
            letter-spacing: 1.5px;

            background: linear-gradient(
                90deg,
                #38bdf8,
                #3b82f6,
                #8b5cf6
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .brand span {
            display: block;
            margin-top: 8px;

            font-size: 10px;
            letter-spacing: 3px;
            font-weight: 600;

            opacity: 0.7;
        }

        /* ================================
           ICON
        ================================= */

        .reset-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            font-size: 34px;

            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);

            box-shadow: 0 0 25px rgba(56, 189, 248, 0.12);
        }

        /* ================================
           TEXT
        ================================= */

        .reset-heading {
            text-align: center;

            font-family: "Orbitron", sans-serif;
            font-size: 20px;
            font-weight: 700;

            margin-bottom: 12px;
        }

        .reset-description {
            text-align: center;

            font-size: 13px;
            line-height: 1.8;

            margin-bottom: 30px;
        }

        /* ================================
           INPUTS
        ================================= */

        .input-group {
            margin-bottom: 21px;
        }

        .input-group label {
            display: block;

            font-size: 12px;
            font-weight: 600;

            margin-bottom: 9px;
        }

        .password-wrapper {
            position: relative;
        }

        .input-group input {
            width: 100%;
            height: 51px;

            padding: 0 52px 0 15px;

            border-radius: 11px;
            outline: none;

            font-family: "Poppins", sans-serif;
            font-size: 13px;

            transition: 0.25s ease;
        }

     .password-toggle {
    position: absolute;

    right: 15px;
    top: 50%;

    transform: translateY(-50%);

    width: 32px;
    height: 32px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: none;
    background: transparent;

    cursor: pointer;

    font-size: 19px;
    color: #38bdf8;

    opacity: 1;
    z-index: 5;

    transition: 0.25s ease;
}

.password-toggle:hover {
    color: #60a5fa;
    transform: translateY(-50%) scale(1.12);
}

html[data-theme="light"] .password-toggle {
    color: #2563eb;
}

        /* ================================
           BUTTON
        ================================= */

        .reset-btn {
            width: 100%;
            height: 52px;

            margin-top: 8px;

            border: none;
            border-radius: 11px;

            background: linear-gradient(
                100deg,
                #0284c7,
                #2563eb,
                #6366f1
            );

            color: #ffffff;

            font-family: "Orbitron", sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;

            cursor: pointer;

            box-shadow: 0 6px 22px rgba(37, 99, 235, 0.25);

            transition: 0.25s ease;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(37, 99, 235, 0.38);
        }

        .reset-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ================================
           MESSAGE
        ================================= */

        .message {
            display: none;

            padding: 12px;
            margin-top: 18px;

            border-radius: 9px;

            font-size: 12px;
            line-height: 1.6;

            text-align: center;
        }

        .message.error {
            display: block;
            color: #ef4444;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .message.success {
            display: block;
            color: #16a34a;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        /* ================================
           FOOTER
        ================================= */

        .back-link {
            display: block;

            margin-top: 25px;

            text-align: center;

            font-size: 12px;
            font-weight: 600;

            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 480px) {

            body {
                padding: 16px;
            }

            .reset-card {
                padding: 30px 23px;
                border-radius: 20px;
            }

            .brand h1 {
                font-size: 23px;
            }

            .reset-heading {
                font-size: 17px;
            }

        }
    </style>
</head>

<body>

    <main class="reset-card">

        <div class="top-controls">

            <button
                type="button"
                class="theme-btn"
                id="themeBtn"
            >
                ☀ Light Mode
            </button>

        </div>

        <header class="brand">

            <h1>EXCEL YOU</h1>

            <span>IMMORTAL TECH SCHOLAR</span>

        </header>

        <div class="reset-icon">
            🔐
        </div>

        <h2 class="reset-heading">
            RESET PASSWORD
        </h2>

        <p class="reset-description">
            Create a new secure password for your
            EXCEL YOU student account.
        </p>

        <form id="resetForm">

            <div class="input-group">

                <label for="newPassword">
                    NEW PASSWORD
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        minlength="8"
                        maxlength="72"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="newPassword"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>

            <div class="input-group">

                <label for="confirmPassword">
                    CONFIRM PASSWORD
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="8"
                        maxlength="72"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="confirmPassword"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="reset-btn"
                id="resetBtn"
            >
                RESET PASSWORD
            </button>

            <div
                class="message"
                id="message"
                role="status"
                aria-live="polite"
            ></div>

        </form>

        <a
            href="/student-login.html"
            class="back-link"
        >
            ← Back to Student Login
        </a>

    </main>

    <script>

// ================================
// THEME SWITCHING
// ================================

const html = document.documentElement;
const themeBtn = document.getElementById("themeBtn");

// Read the theme selected on the login page
let savedTheme = "dark";

try {
    savedTheme = localStorage.getItem("theme") || "dark";
} catch (err) {
    savedTheme = "dark";
}

// Apply theme
function applyTheme(theme) {

    html.setAttribute("data-theme", theme);

    themeBtn.textContent =
        theme === "dark"
            ? "☀ Light Mode"
            : "🌙 Dark Mode";

    try {
        localStorage.setItem("theme", theme);
    } catch (err) {
        console.warn("Unable to save theme preference.");
    }
}

// Initial theme
applyTheme(savedTheme === "light" ? "light" : "dark");

// Theme button
themeBtn.addEventListener("click", function () {

    const currentTheme =
        html.getAttribute("data-theme");

    const newTheme =
        currentTheme === "dark" ? "light" : "dark";

    applyTheme(newTheme);

});


        // ================================
        // SHOW / HIDE PASSWORD
        // ================================

        document.querySelectorAll(".password-toggle")
            .forEach(button => {

                button.addEventListener("click", () => {

                    const input = document.getElementById(
                        button.dataset.target
                    );

                    const isPassword =
                        input.type === "password";

                    input.type =
                        isPassword ? "text" : "password";

                    button.textContent =
                        isPassword ? "🙈" : "👁";

                    button.setAttribute(
                        "aria-label",
                        isPassword ? "Hide password" : "Show password"
                    );

                });

            });


        // ================================
        // PASSWORD RESET
        // ================================

        const resetForm =
            document.getElementById("resetForm");

        const resetBtn =
            document.getElementById("resetBtn");

        const message =
            document.getElementById("message");

        resetForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            message.className = "message";
            message.textContent = "";

            const params =
                new URLSearchParams(window.location.search);

            const token = params.get("token");
            const email = params.get("email");

            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (!token || !email) {

                message.className = "message error";
                message.textContent =
                    "Invalid or incomplete password reset link.";

                return;

            }

            if (newPassword.length < 8) {

                message.className = "message error";
                message.textContent =
                    "Password must contain at least 8 characters.";

                return;

            }

            if (new TextEncoder().encode(newPassword).length > 72) {

                message.className = "message error";
                message.textContent =
                    "Password is too long. Maximum is 72 UTF-8 bytes.";

                return;

            }

            if (newPassword !== confirmPassword) {

                message.className = "message error";
                message.textContent =
                    "Passwords do not match.";

                return;

            }

            resetBtn.disabled = true;
            resetBtn.textContent = "PROCESSING...";

            try {

                const response = await fetch(
                    "/api/student/reset-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email,
                            token,
                            newPassword
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok || !data.success) {

                    throw new Error(
                        data.message || "Unable to reset password."
                    );

                }

                message.className = "message success";
                message.textContent =
                    "Password reset successfully! Redirecting to login...";

                resetForm.reset();

                resetBtn.textContent = "SUCCESS";

                setTimeout(() => {

                    window.location.href =
                        "/student-login.html";

                }, 2500);

            } catch (error) {

                message.className = "message error";
                message.textContent = error.message;

                resetBtn.disabled = false;
                resetBtn.textContent = "RESET PASSWORD";

            }

        });

    </script>

</body>
</html>
